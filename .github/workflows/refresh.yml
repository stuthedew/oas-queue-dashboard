name: Refresh dashboard

# Rebuilds site/data/snapshot.json from a fresh clone of open-anesthesia-sim and
# republishes the site. Nothing is written to that repository.
on:
  schedule:
    # Every 15 minutes, away from the top of the hour, when GitHub delays schedules most.
    # If you change this, change INTERVAL_MINUTES below to match.
    - cron: "7,22,37,52 * * * *"
    # Once a day, for the keepalive job at the bottom.
    - cron: "41 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

env:
  INTERVAL_MINUTES: "15"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Snapshot the docket
        run: python3 extract.py --out site/data --interval-minutes "$INTERVAL_MINUTES"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  keepalive:
    # GitHub switches off schedules in a public repository after 60 days without
    # repository activity. An empty commit after 50 quiet days prevents that.
    if: github.event_name == 'schedule' && github.event.schedule == '41 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Commit if the repository has been quiet for 50 days
        run: |
          quiet_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $quiet_days days ago"
          if [ "$quiet_days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled refresh enabled"
            git push
          fi
